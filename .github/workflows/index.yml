name: Update DFU Index

# Runs whenever a package, models.json or this workflow changes, and keeps
# index.json in sync. Use the manual trigger to re-run without a change.
on:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - 'models.json'
      - 'scripts/**'
      - '.github/workflows/index.yml'
  workflow_dispatch:
    inputs:
      force_dispatch:
        description: 'Notify the receivers even when index.json did not change'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  update_index:
    runs-on: ubuntu-latest
    name: Rebuild index.json
    steps:
      - uses: actions/checkout@v7
        with:
          # full history: a package release date is the date of its last commit
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build index.json
        run: node scripts/build-index.mjs

      - name: Commit index.json when it changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- index.json)" ]; then
            echo "index.json is up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "update index.json [skip ci]"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify LINK and the docs site
        if: steps.commit.outputs.changed == 'true' || inputs.force_dispatch
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          for repo in web-link link-docs-website; do
            echo "dispatching dfu-update to lnelab/${repo}"
            curl -fsS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${PAT}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/lnelab/${repo}/dispatches" \
              -d '{"event_type":"dfu-update"}'
          done
